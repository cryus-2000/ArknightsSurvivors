custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<!--SHUIYUE_LOADER-->\n<script>\n(function(){\n  // 手机：竖屏时盖一层\"请横屏\"提示；首次触摸时尝试全屏 + 锁定横屏（Android Chrome 支持，iOS 只能靠提示）\n  var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 900);\n  if (!mobile) return;\n  function ov(){\n    var e = document.getElementById('rot');\n    if (!e) {\n      e = document.createElement('div'); e.id = 'rot';\n      e.style.cssText = 'position:fixed;inset:0;background:#02060a;color:#cfe;display:none;align-items:center;justify-content:center;z-index:9999;font:20px/1.6 sans-serif;text-align:center';\n      e.innerHTML = '<div><div style=\"font-size:48px\">&#8635;</div>请将手机横过来<br><span style=\"font-size:13px;opacity:.7\">ROTATE TO LANDSCAPE</span></div>';\n      document.body.appendChild(e);\n    }\n    return e;\n  }\n  function chk(){ var e = ov(); e.style.display = (innerHeight > innerWidth) ? 'flex' : 'none'; }\n  addEventListener('resize', chk); addEventListener('orientationchange', chk);\n  document.addEventListener('DOMContentLoaded', chk);\n  document.addEventListener('touchend', function(){\n    try {\n      var el = document.documentElement;\n      var f = el.requestFullscreen || el.webkitRequestFullscreen;\n      if (f && !document.fullscreenElement) {\n        var p = f.call(el);\n        if (p && p.then) p.then(function(){ if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); }).catch(function(){});\n      }\n    } catch (e) {}\n  }, {passive: true});\n})();\n</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
