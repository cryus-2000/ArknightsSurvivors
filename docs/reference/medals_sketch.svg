    <text x="350" y="90">结局</text><text x="410" y="90">藏品</text><text x="470" y="90">物品</text>
    <rect x="535" y="64" width="86" height="40" fill="#1b2d3f" stroke="#38d6f0"/><text x="552" y="90" fill="#e8f6ff">蚀刻章 ◆ 新</text>
    <text x="1040" y="90" fill="#9db4c4">已获得 17 / 36　镀层 3</text>
  </g>
  <!-- 左：分组 -->
  <g font-size="14">
    <rect x="40" y="120" width="190" height="560" fill="#101a26" stroke="#27394b"/>
    <rect x="48" y="132" width="174" height="34" fill="#1b2d3f" stroke="#38d6f0"/><text x="62" y="154" fill="#e8f6ff">全部　17 / 36</text>
    <text x="62" y="190" fill="#9db4c4">进　度　5 / 7</text>
    <text x="62" y="222" fill="#9db4c4">干　员　4 / 8</text>
    <text x="62" y="254" fill="#9db4c4">挑　战　4 / 10</text>
    <text x="62" y="286" fill="#9db4c4">收　集　3 / 6</text>
    <text x="62" y="318" fill="#9db4c4">隐　藏　1 / 5</text>
    <text x="62" y="372" fill="#5f7587" font-size="12">筛选</text>
    <text x="62" y="396" fill="#9db4c4" font-size="12">□ ★　□ ★★　□ ★★★</text>
    <text x="62" y="420" fill="#9db4c4" font-size="12">□ 有镀层　□ 未获得</text>
  </g>
  <!-- 中：章盒网格 -->
  <g>
    <rect x="250" y="120" width="620" height="560" fill="#0e1620" stroke="#27394b"/>
    <text x="270" y="148" fill="#8fb4c8" font-size="13" letter-spacing="2">进　度</text>
    <!-- 已得 -->
    <g stroke="#38d6f0" fill="#14283a">
      <circle cx="318" cy="206" r="34"/><circle cx="414" cy="206" r="34"/><circle cx="510" cy="206" r="34"/>
      <circle cx="606" cy="206" r="34"/><circle cx="702" cy="206" r="34"/>
    </g>
    <!-- 镀层：金边 -->
    <circle cx="414" cy="206" r="34" fill="none" stroke="#f3c86b" stroke-width="3"/>
    <circle cx="606" cy="206" r="34" fill="none" stroke="#f3c86b" stroke-width="3"/>
    <g fill="#e8f6ff" font-size="12" text-anchor="middle">
      <text x="318" y="212">初潮</text><text x="414" y="212">潮来潮往</text><text x="510" y="212">靠岸</text>
      <text x="606" y="212">识洋者</text><text x="702" y="212">放射性</text>
    </g>
    <g fill="#f3c86b" font-size="11" text-anchor="middle"><text x="318" y="256">★</text><text x="414" y="256">★★ 镀</text><text x="510" y="256">★</text><text x="606" y="256">★★ 镀</text><text x="702" y="256">★★</text></g>
    <!-- 未得 -->
    <g stroke="#34475a" fill="#0b1018" stroke-dasharray="4 4">
      <circle cx="798" cy="206" r="34"/>
    </g>
    <text x="798" y="212" fill="#3e5265" font-size="12" text-anchor="middle">四种潮声</text>
    <text x="798" y="256" fill="#3e5265" font-size="11" text-anchor="middle">★★★</text>
    <text x="270" y="316" fill="#8fb4c8" font-size="13" letter-spacing="2">隐　藏</text>
    <g stroke="#34475a" fill="#0b1018" stroke-dasharray="4 4">
      <circle cx="318" cy="374" r="34"/><circle cx="414" cy="374" r="34"/>
    </g>
    <text x="318" y="382" fill="#3e5265" font-size="22" text-anchor="middle">？</text>
    <text x="414" y="382" fill="#3e5265" font-size="22" text-anchor="middle">？</text>
    <circle cx="510" cy="374" r="34" fill="#14283a" stroke="#38d6f0"/>
    <text x="510" y="380" fill="#e8f6ff" font-size="12" text-anchor="middle">一毛不拔</text>
    <text x="270" y="470" fill="#5f7587" font-size="12">（其余分组向下滚动；选中一枚时右栏显示详情）</text>
  </g>
  <!-- 右：详情 -->
  <g>
    <rect x="890" y="120" width="350" height="560" fill="#101a26" stroke="#27394b"/>
    <circle cx="1065" cy="210" r="56" fill="#14283a" stroke="#f3c86b" stroke-width="4"/>
    <text x="1065" y="218" fill="#e8f6ff" font-size="20" text-anchor="middle">识洋者</text>
    <text x="1065" y="296" fill="#f3c86b" font-size="14" text-anchor="middle">★★　已镀层</text>
    <text x="910" y="340" fill="#9db4c4" font-size="14">条件　通关「高压」</text>
    <text x="910" y="368" fill="#9db4c4" font-size="14">镀层　通关「深潮」　✓ 已达成</text>
    <text x="910" y="412" fill="#cfe3ef" font-size="14">「潮线之下，没有看不清的路。」</text>
    <text x="910" y="470" fill="#5f7587" font-size="12">获得于 10-24　　镀层于 10-29</text>
    <text x="910" y="500" fill="#5f7587" font-size="12">纯荣誉：不给藏品、生机细胞或数值</text>
  </g>
  <!-- 草图 B：局内/结算提示 -->
  <text x="40" y="720" fill="#8fb4c8" font-size="16" letter-spacing="3">草图 B · 获得提示</text>
  <g>
    <rect x="720" y="690" width="320" height="52" fill="#101a26" stroke="#38d6f0"/>
    <circle cx="750" cy="716" r="18" fill="#14283a" stroke="#38d6f0"/>
    <text x="780" y="710" fill="#e8f6ff" font-size="14">蚀刻章 · 整点钟声</text>
    <text x="780" y="730" fill="#7d93a3" font-size="12">局内右下角小条，2.5 秒，不打断操作</text>
    <rect x="1060" y="690" width="180" height="52" fill="#101a26" stroke="#f3c86b"/>
    <text x="1074" y="712" fill="#f3c86b" font-size="13">结算页底栏「本次获得」</text>
    <text x="1074" y="732" fill="#7d93a3" font-size="12">章列表 · 点开跳到陈列页</text>
  </g>
