<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
  <rect width="1280" height="760" fill="#0b1018"/>
  <text x="40" y="44" fill="#8fb4c8" font-size="16" letter-spacing="3">草图 A · 图鉴 ▸ 蚀刻章页（桌面 1280×720）</text>
  <!-- 图鉴页签 -->
  <g font-size="14" fill="#7d93a3">
    <rect x="40" y="64" width="1200" height="40" fill="#101a26" stroke="#27394b"/>
