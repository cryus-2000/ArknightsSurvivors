<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1200" height="640" fill="#0b1620"/>
  <text x="24" y="36" fill="#e8e2d6" font-size="20">148 · 原作层次 ↔ 本作时间，以及四个结局的事件链（四个方案共用）</text>
  <text x="24" y="60" fill="#8fa3ad" font-size="13">上：原作「水月与深蓝之树」各层（数据 zones）；中：本作 10 分钟时间线；下：按原作重排的结局事件链。虚线 = 本作拟，实线 = 原作有</text>

  <!-- original layers -->
  <g font-size="12" fill="#e8e2d6">
    <rect x="40" y="80" width="160" height="34" fill="#18303d" stroke="#3b6475"/>
    <text x="50" y="102">第1层 天光海岸 → 行商</text>
    <rect x="200" y="80" width="190" height="34" fill="#18303d" stroke="#3b6475"/>
    <text x="210" y="102">第2层 离岸孤岛 → 得偿所愿</text>
    <rect x="390" y="80" width="80" height="34" fill="#2a2440" stroke="#7a62b0"/>
    <text x="396" y="96" font-size="11">第3层末</text>
    <text x="396" y="110" font-size="11">险路恶敌</text>
    <rect x="470" y="80" width="300" height="34" fill="#18303d" stroke="#3b6475"/>
    <text x="480" y="102">第4层 隐秘温床 → 得偿所愿　/　第5层 失尘岩洞</text>
    <rect x="770" y="80" width="200" height="34" fill="#2a2440" stroke="#7a62b0"/>
    <text x="778" y="102">第5层末 险路恶敌（结局一 / 二）</text>
    <rect x="970" y="80" width="200" height="34" fill="#132a24" stroke="#3fae8c"/>
    <text x="978" y="96" font-size="11">第6层 幽海丛林（隐藏区域）</text>
    <text x="978" y="110" font-size="11">结局三 / 四的最终关</text>
  </g>

  <!-- timeline -->
  <line x1="40" y1="160" x2="1170" y2="160" stroke="#8fa3ad" stroke-width="2"/>
  <g font-size="12" fill="#8fa3ad">
    <text x="36" y="182">0:00</text>
    <line x1="254" y1="152" x2="254" y2="168" stroke="#f2c46d" stroke-width="2"/><text x="236" y="182" fill="#f2c46d">2:00 商人</text>
    <line x1="414" y1="148" x2="414" y2="172" stroke="#d05a8a" stroke-width="3"/><text x="388" y="186" fill="#d05a8a">3:30 中 Boss</text>
    <line x1="575" y1="152" x2="575" y2="168" stroke="#f2c46d" stroke-width="2"/><text x="557" y="182" fill="#f2c46d">5:00 商人</text>
    <line x1="789" y1="148" x2="789" y2="172" stroke="#d05a8a" stroke-width="3"/><text x="760" y="186" fill="#d05a8a">7:00 中 Boss</text>
    <line x1="896" y1="152" x2="896" y2="168" stroke="#f2c46d" stroke-width="2"/><text x="866" y="182" fill="#f2c46d">8:00 商人</text>
    <line x1="1003" y1="152" x2="1003" y2="168" stroke="#8fd3ff" stroke-width="2"/><text x="930" y="200" fill="#8fd3ff">9:00 终局预告 / 结局冻结</text>
    <line x1="1110" y1="148" x2="1110" y2="172" stroke="#ff5a7a" stroke-width="3"/><text x="1080" y="186" fill="#ff5a7a">10:00 最终 Boss</text>
  </g>
  <!-- crossroads markers -->
  <g>
    <circle cx="414" cy="226" r="14" fill="none" stroke="#f2c46d" stroke-width="2"/>
    <text x="408" y="231" fill="#f2c46d" font-size="13">Ⅰ</text>
    <text x="436" y="231" fill="#f2c46d" font-size="13">路口一（原作：第3层末险路恶敌前）</text>
    <circle cx="789" cy="226" r="14" fill="none" stroke="#f2c46d" stroke-width="2"/>
    <text x="783" y="231" fill="#f2c46d" font-size="13">Ⅱ</text>
    <text x="811" y="231" fill="#f2c46d" font-size="13">路口二（原作：第4层起至第5层末前）</text>
  </g>

  <!-- event chain tree -->
  <g font-size="12">
    <!-- default -->
    <rect x="40" y="270" width="230" height="50" rx="4" fill="#1d1a2c" stroke="#cc8cff"/>
    <text x="52" y="291" fill="#cc8cff">都不走 / 不拿信物</text>
    <text x="52" y="310" fill="#e8e2d6">→ 结局一 平凡即是喜乐（偏执泡影）</text>

    <!-- knight line -->
    <rect x="300" y="270" width="250" height="60" rx="4" fill="#12232c" stroke="#9fd8ff"/>
    <text x="312" y="290" fill="#9fd8ff">狂徒妄念：愤怒 / 呼号 / 沉默 / 离开</text>
    <text x="312" y="310" fill="#e8e2d6">愤怒（必得）· 呼号（概率）→ 海潮的气息</text>
    <text x="312" y="324" fill="#8fa3ad" font-size="11">猎潮的骑士出现在战场，直至被击败</text>
    <line x1="550" y1="300" x2="640" y2="300" stroke="#9fd8ff" stroke-width="2"/>
    <rect x="640" y="270" width="250" height="60" rx="4" fill="#12232c" stroke="#9fd8ff"/>
    <text x="652" y="290" fill="#9fd8ff">骑士仍在（非必须）：反抗 / 挣脱 / 逐流</text>
    <text x="652" y="310" fill="#e8e2d6">反抗 → 荒诞命运　挣脱 → 骑士骨血</text>
    <text x="652" y="324" fill="#8fa3ad" font-size="11">骑士阵亡 / 退行的罗辛南特 → 回到结局一</text>
    <line x1="890" y1="300" x2="930" y2="300" stroke="#9fd8ff" stroke-width="2"/>
    <rect x="930" y="270" width="240" height="60" rx="4" fill="#12232c" stroke="#9fd8ff"/>
    <text x="942" y="292" fill="#9fd8ff">结局二 静谧时代</text>
    <text x="942" y="312" fill="#e8e2d6">最终关改为「命运的宠儿」</text>
    <text x="942" y="326" fill="#8fa3ad" font-size="11">最后的骑士（本作：9:00 入潮 10:00 重生）</text>

    <!-- opening -->
    <rect x="300" y="370" width="250" height="78" rx="4" fill="#101d2e" stroke="#5aa0ff"/>
    <text x="312" y="390" fill="#5aa0ff">开端：四选一（与狂徒妄念同处路口一）</text>
    <text x="312" y="409" fill="#e8e2d6">决定潜入深海 → 主教的研究</text>
    <text x="312" y="425" fill="#e8e2d6">“深蓝”？！ → 深蓝回忆（灯火见底）</text>
    <text x="312" y="441" fill="#8fa3ad" font-size="11">噩梦…… → 小奖励　离开 → 无</text>

    <!-- deep line -->
    <line x1="550" y1="400" x2="640" y2="400" stroke="#5aa0ff" stroke-width="2"/>
    <rect x="640" y="372" width="250" height="60" rx="4" fill="#101d2e" stroke="#5aa0ff"/>
    <text x="652" y="392" fill="#5aa0ff">深蓝之心（需主教的研究 + 灯火 ≥ 20）</text>
    <text x="652" y="410" fill="#e8e2d6">五个房间各付 20 灯火换资源</text>
    <text x="652" y="425" fill="#e8e2d6">搜寻园林 → 深蓝之心　（后接 赞歌 → 绝唱）</text>
    <line x1="890" y1="402" x2="930" y2="402" stroke="#5aa0ff" stroke-width="2"/>
    <rect x="930" y="372" width="240" height="60" rx="4" fill="#132a24" stroke="#3fae8c"/>
    <text x="942" y="394" fill="#3fae8c">结局三 息潮的代价</text>
    <text x="942" y="414" fill="#e8e2d6">进入幽海丛林：大群所向</text>
    <text x="942" y="428" fill="#8fa3ad" font-size="11">伊莎玛拉，腐化之心</text>

    <!-- blue memory line -->
    <path d="M550 430 C 590 430, 600 490, 640 490" fill="none" stroke="#f2c46d" stroke-width="2"/>
    <rect x="640" y="460" width="250" height="92" rx="4" fill="#211c10" stroke="#f2c46d"/>
    <text x="652" y="480" fill="#f2c46d">深蓝仪式（非必须）· 升华（需深蓝回忆）</text>
    <text x="652" y="498" fill="#e8e2d6">仪式：关闭流程 +30 灯火 / 不改 → 深蓝之树</text>
    <text x="652" y="516" fill="#e8e2d6">升华三句：灯火 ≥ 90 才能选「决心」</text>
    <text x="652" y="532" fill="#e8e2d6">≥ 50 才能选「观望」，否则只剩「犹疑」</text>
    <text x="652" y="546" fill="#8fa3ad" font-size="11">灯火越高，信物越强（原作规则）</text>
    <line x1="890" y1="505" x2="930" y2="505" stroke="#f2c46d" stroke-width="2"/>
    <rect x="930" y="475" width="240" height="60" rx="4" fill="#132a24" stroke="#3fae8c"/>
    <text x="942" y="497" fill="#f2c46d">结局四 如星空般深蓝</text>
    <text x="942" y="517" fill="#e8e2d6">进入幽海丛林：人之光辉</text>
    <text x="942" y="531" fill="#8fa3ad" font-size="11">伊祖米克，生态泉源</text>
  </g>
  <!-- column labels -->
  <g font-size="12" fill="#f2c46d">
    <text x="380" y="262">← 路口一 Ⅰ →</text>
    <text x="720" y="262">← 路口二 Ⅱ →</text>
    <text x="1010" y="262">9:00 冻结 → 10:00</text>
  </g>
  <text x="24" y="600" fill="#8fa3ad" font-size="12">结局判定（原作数据 endings 优先级）：持决心 / 观望 / 犹疑之一 → 结局四；否则持深蓝之心 → 结局三；否则持海潮的气息且骑士在 → 结局二；否则结局一。</text>
  <text x="24" y="620" fill="#8fa3ad" font-size="12">出处：PRTS「水月与深蓝之树」结局与事件；ArknightsGameData roguelike_topic_table.json（rogue_2 choiceScenes / relics.change_stage / zones）。</text>
</svg>
