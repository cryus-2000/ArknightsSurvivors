<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1200" height="900" fill="#0b1620"/>
  <text x="24" y="34" fill="#e8e2d6" font-size="20">148 · 四个方案的画面示意（程序画的示意，不是游戏截图）</text>

  <!-- ========== A ========== -->
  <g transform="translate(20,52)">
    <rect width="570" height="400" fill="#0f1f2b" stroke="#f2c46d"/>
    <text x="14" y="26" fill="#f2c46d" font-size="16">方案 A · 深入海洋 · 航路图（推荐）</text>
    <text x="14" y="46" fill="#8fa3ad" font-size="12">3:30 / 7:00 Boss 战结束后暂停一次，选下一段走哪条航路</text>
    <!-- panel -->
    <rect x="14" y="58" width="542" height="300" fill="#122838" stroke="#3b6475"/>
    <text x="28" y="82" fill="#e8e2d6" font-size="14">深入海洋 · 隐秘温床</text>
    <text x="400" y="82" fill="#f2c46d" font-size="12">灯火 62 · 照亮</text>
    <!-- start -->
    <circle cx="60" cy="210" r="12" fill="#e8e2d6"/>
    <text x="40" y="240" fill="#8fa3ad" font-size="11">当前位置</text>
    <!-- lane 1 -->
    <line x1="72" y1="206" x2="170" y2="130" stroke="#8fa3ad" stroke-width="2"/>
    <rect x="170" y="112" width="36" height="36" fill="#1b3a4c" stroke="#d05a8a"/><text x="176" y="135" fill="#d05a8a" font-size="12">紧急</text>
    <line x1="206" y1="130" x2="300" y2="130" stroke="#8fa3ad" stroke-width="2"/>
    <rect x="300" y="112" width="36" height="36" fill="#1b3a4c" stroke="#5aa0ff"/><text x="308" y="136" fill="#5aa0ff" font-size="16">?</text>
    <text x="346" y="128" fill="#e8e2d6" font-size="12">不期而遇「开端」</text>
    <text x="346" y="144" fill="#8fa3ad" font-size="11">约 4:10 弹出事件</text>
    <!-- lane 2 -->
    <line x1="72" y1="210" x2="170" y2="210" stroke="#8fa3ad" stroke-width="2"/>
    <rect x="170" y="192" width="36" height="36" fill="#1b3a4c" stroke="#9fd8ff"/><text x="178" y="216" fill="#9fd8ff" font-size="16">?</text>
    <line x1="206" y1="210" x2="300" y2="210" stroke="#8fa3ad" stroke-width="2"/>
    <rect x="300" y="192" width="36" height="36" fill="#1b3a4c" stroke="#3fae8c"/><text x="304" y="215" fill="#3fae8c" font-size="12">角落</text>
    <text x="346" y="208" fill="#e8e2d6" font-size="12">不期而遇「狂徒妄念」</text>
    <text x="346" y="224" fill="#8fa3ad" font-size="11">→ 安全的角落（补给箱）</text>
    <!-- lane 3 hidden -->
    <line x1="72" y1="214" x2="170" y2="290" stroke="#8fa3ad" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="170" y="272" width="36" height="36" fill="none" stroke="#f2c46d" stroke-dasharray="4 3"/><text x="176" y="295" fill="#f2c46d" font-size="12">许愿</text>
    <line x1="206" y1="290" x2="300" y2="290" stroke="#8fa3ad" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="300" y="272" width="36" height="36" fill="#1b3a4c" stroke="#8fa3ad"/><text x="304" y="295" fill="#8fa3ad" font-size="12">作战</text>
    <text x="346" y="288" fill="#f2c46d" font-size="12">暗航路（只在灯火中档时看得见）</text>
    <text x="346" y="304" fill="#8fa3ad" font-size="11">得偿所愿：藏品三选一</text>
    <text x="28" y="344" fill="#8fa3ad" font-size="11">← → 选航路，确认即继续；机器人按规则选；手机点卡片</text>
    <text x="14" y="384" fill="#e8e2d6" font-size="12">节点在这一段里按时刻兑现：事件 = 直接弹面板，不用走过去</text>
  </g>

  <!-- ========== B ========== -->
  <g transform="translate(610,52)">
    <rect width="570" height="400" fill="#0f1f2b" stroke="#5aa0ff"/>
    <text x="14" y="26" fill="#5aa0ff" font-size="16">方案 B · 不期而遇 · 岔路航标</text>
    <text x="14" y="46" fill="#8fa3ad" font-size="12">场上同时出现两三座航标，往哪边走就是选哪条路；碰到一座，其余隐入海雾</text>
    <rect x="14" y="58" width="542" height="300" fill="#0d1a24" stroke="#3b6475"/>
    <circle cx="285" cy="208" r="140" fill="none" stroke="#e8e2d6" stroke-dasharray="4 6" stroke-opacity="0.5"/>
    <text x="380" y="78" fill="#8fa3ad" font-size="11">黑潮安全圈</text>
    <circle cx="285" cy="208" r="7" fill="#e8e2d6"/>
    <text x="270" y="232" fill="#8fa3ad" font-size="11">队长</text>
    <!-- marker NW -->
    <g transform="translate(160,120)">
      <rect x="-14" y="-14" width="28" height="28" transform="rotate(45)" fill="#12233a" stroke="#5aa0ff" stroke-width="2"/>
      <text x="-5" y="6" fill="#5aa0ff" font-size="15">?</text>
      <text x="-40" y="-26" fill="#5aa0ff" font-size="12">开端</text>
    </g>
    <line x1="278" y1="202" x2="178" y2="134" stroke="#5aa0ff" stroke-dasharray="3 5"/>
    <!-- marker SE -->
    <g transform="translate(420,280)">
      <rect x="-14" y="-14" width="28" height="28" transform="rotate(45)" fill="#12233a" stroke="#9fd8ff" stroke-width="2"/>
      <text x="-5" y="6" fill="#9fd8ff" font-size="15">?</text>
      <text x="-30" y="36" fill="#9fd8ff" font-size="12">狂徒妄念</text>
    </g>
    <line x1="292" y1="214" x2="404" y2="270" stroke="#9fd8ff" stroke-dasharray="3 5"/>
    <!-- hidden marker -->
    <g transform="translate(430,120)">
      <rect x="-12" y="-12" width="24" height="24" transform="rotate(45)" fill="none" stroke="#f2c46d" stroke-dasharray="3 3"/>
      <text x="-30" y="-22" fill="#f2c46d" font-size="11">暗航标（灯火中档可见）</text>
    </g>
    <!-- edge pointers -->
    <text x="28" y="344" fill="#8fa3ad" font-size="11">屏外照旧画方位指示；各航标 60 秒没人到就沉没；都不去 = 结局一</text>
    <text x="14" y="384" fill="#e8e2d6" font-size="12">改动最小：沿用现在的事件箱代码，换外观、加互斥</text>
  </g>

  <!-- ========== C ========== -->
  <g transform="translate(20,470)">
    <rect width="570" height="400" fill="#0f1f2b" stroke="#3fae8c"/>
    <text x="14" y="26" fill="#3fae8c" font-size="16">方案 C · 险路恶敌的战利品 + 诡意行商</text>
    <text x="14" y="46" fill="#8fa3ad" font-size="12">没有单独的事件物件：结局信物从 Boss 战利品和商人货架里拿</text>
    <rect x="14" y="58" width="542" height="300" fill="#10202a" stroke="#3b6475"/>
    <text x="28" y="84" fill="#e8e2d6" font-size="14">Boss 宝箱 · 圣徒卡门（3:30）</text>
    <g font-size="12">
      <rect x="28" y="100" width="160" height="200" fill="#162c38" stroke="#8fa3ad"/>
      <text x="40" y="124" fill="#e8e2d6">普通藏品</text>
      <text x="40" y="146" fill="#8fa3ad" font-size="11">（照常的战利品）</text>
      <rect x="200" y="100" width="160" height="200" fill="#162c38" stroke="#5aa0ff"/>
      <text x="212" y="124" fill="#5aa0ff">主教的研究</text>
      <text x="212" y="146" fill="#8fa3ad" font-size="11">遭诅 · 让探索走向</text>
      <text x="212" y="162" fill="#8fa3ad" font-size="11">不同的结局</text>
      <text x="212" y="190" fill="#8fa3ad" font-size="11">（开端·决定潜入深海）</text>
      <rect x="372" y="100" width="160" height="200" fill="#162c38" stroke="#9fd8ff"/>
      <text x="384" y="124" fill="#9fd8ff">海潮的气息</text>
      <text x="384" y="146" fill="#8fa3ad" font-size="11">猎潮的骑士加入</text>
      <text x="384" y="190" fill="#8fa3ad" font-size="11">（狂徒妄念·愤怒）</text>
    </g>
    <text x="28" y="330" fill="#8fa3ad" font-size="11">7:00 Boss 宝箱给第二环（升华三句 / 骑士骨血）；5:00 商人：持主教的研究可买深蓝之心</text>
    <text x="14" y="384" fill="#e8e2d6" font-size="12">实现最省，但「选路」感最弱；Boss 撤离要补发</text>
  </g>

  <!-- ========== D ========== -->
  <g transform="translate(610,470)">
    <rect width="570" height="400" fill="#0f1f2b" stroke="#cc8cff"/>
    <text x="14" y="26" fill="#cc8cff" font-size="16">方案 D · 瞥视 · 溟痕石碑</text>
    <text x="14" y="46" fill="#8fa3ad" font-size="12">石碑立在溟痕里：点灯再读 = 「人」的选项；踩进溟痕读 = 「深蓝」的选项</text>
    <rect x="14" y="58" width="542" height="300" fill="#0d1520" stroke="#3b6475"/>
    <!-- mire patch -->
    <ellipse cx="300" cy="200" rx="150" ry="95" fill="#2a1638" fill-opacity="0.85" stroke="#6b3a8a"/>
    <ellipse cx="270" cy="190" rx="90" ry="50" fill="#3a1d4c" fill-opacity="0.8"/>
    <!-- stele -->
    <rect x="290" y="150" width="26" height="56" fill="#3a4a5a" stroke="#9fd8ff"/>
    <line x1="296" y1="166" x2="310" y2="166" stroke="#9fd8ff"/><line x1="296" y1="178" x2="310" y2="178" stroke="#9fd8ff"/>
    <text x="324" y="166" fill="#9fd8ff" font-size="12">溟痕石碑</text>
    <!-- beacon -->
    <circle cx="140" cy="250" r="34" fill="none" stroke="#f2c46d" stroke-width="2"/>
    <rect x="135" y="232" width="10" height="24" fill="#f2c46d"/>
    <text x="112" y="304" fill="#f2c46d" font-size="12">引航灯标</text>
    <text x="28" y="330" fill="#f2c46d" font-size="11">点燃 → 净化溟痕 → 「人」的选项</text>
    <text x="300" y="330" fill="#cc8cff" font-size="11">不点灯踩进溟痕读 → 付灯火，「深蓝」的选项</text>
    <circle cx="470" cy="120" r="7" fill="#e8e2d6"/>
    <text x="456" y="146" fill="#8fa3ad" font-size="11">队长</text>
    <text x="14" y="384" fill="#e8e2d6" font-size="12">和灯标 / 溟痕 / 灯火绑得最紧；但要绕路、要点灯，最费时间</text>
  </g>
</svg>
