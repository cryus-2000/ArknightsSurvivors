<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>水月 · 攻击美术 V2</title>
<style>body{font:16px system-ui;background:#142333;color:#e5f4fa;margin:32px}main{display:flex;flex-wrap:wrap;gap:20px}article{background:#243447;padding:20px;border-radius:12px}canvas{image-rendering:pixelated;display:block;margin:20px auto}button{padding:8px 18px;margin:0 8px 24px 0}p{color:#b6cbd9}h1{font-size:24px}</style>
<h1>水月 · 挥伞与水弧</h1><p>实际像素帧条；独立播放，不模拟游戏命中判定。</p><button onclick="speed=1">原速</button><button onclick="speed=0.25">慢放 ×0.25</button><main></main>
<script>let speed=0.25;for(const [name,size,duration] of [['player_attack',32,250],['player_attack_48',48,250],['slash',48,220],['fx_hit',16,160]]){const a=document.createElement('article');a.innerHTML=`<b>${name}</b><p>${size} × ${size} · 4 帧</p>`;const c=document.createElement('canvas');c.width=c.height=size;c.style.width=c.style.height=(size*6)+'px';a.append(c);document.querySelector('main').append(a);const im=new Image();im.src=name+'.png';im.onload=()=>{const ctx=c.getContext('2d');function tick(t){const tt=t*speed%(duration+300);const f=Math.min(3,Math.floor(tt/duration*4));ctx.clearRect(0,0,size,size);if(tt<duration||name.startsWith('player'))ctx.drawImage(im,f*size,0,size,size,0,0,size,size);requestAnimationFrame(tick)}requestAnimationFrame(tick)};im.onerror=()=>a.append('素材加载失败');}</script></html>
