<!doctype html><meta charset="utf-8"><title>Logos 特效预览</title>
<style>body{background:#172233;color:#eef4ff;font:16px system-ui;padding:24px}canvas{image-rendering:pixelated;background:#283448;max-width:100%;border:1px solid #526079}label{margin-right:24px}</style>
<h1>Logos · 符咒与墨蓝法术弹</h1><p>美术分层预览；游戏接入与实际速度由 Claude 验证。</p><label><input id="pause" type="checkbox">暂停</label><label>速度 <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"></label><p id="status">正在读取图片…</p><canvas id="c" width="900" height="430"></canvas>
<script>
const names=['fx_logos_s3_back','fx_logos_s3_front','op_logos_idle','fx_logos_script','fx_logos_s1_link','proj_logos_ink'];const images={};let t=0,last=0;const ctx=document.querySelector('#c').getContext('2d');ctx.imageSmoothingEnabled=false;
Promise.all(names.map(n=>new Promise((ok,fail)=>{const im=new Image();im.onload=()=>{images[n]=im;ok()};im.onerror=()=>fail(n);im.src=n+'@2x.png'}))).then(()=>{document.querySelector('#status').textContent='S3：后层 → 人物 → 前层；S2：滚动咒文；S1：黑色怪间连线；普攻：右行墨蓝弹';requestAnimationFrame(draw)}).catch(n=>document.querySelector('#status').textContent='缺少图片：'+n);
function spr(n,f,w,h,x,y,scale=1){ctx.drawImage(images[n],f*w,0,w,h,x,y,w*scale,h*scale)}
function draw(ms){if(!document.querySelector('#pause').checked)t+=Math.min(0.05,(ms-last)/1000)*Number(document.querySelector('#speed').value);last=ms;ctx.clearRect(0,0,900,430);ctx.fillStyle='#eff5ff';ctx.font='18px sans-serif';ctx.fillText('S3 符咒缠绕',28,30);const f=Math.floor(t*10)%6;spr('fx_logos_s3_back',f,96,112,35,60,2);spr('op_logos_idle',Math.floor(t*4)%4,96,96,35,76,2);spr('fx_logos_s3_front',f,96,112,35,60,2);ctx.fillText('S2 高速咒文',320,50);for(let i=0;i<4;i++)spr('fx_logos_script',(Math.floor(t*12)+i)%4,128,24,320+i*128,70);ctx.fillText('S1 黑色咒文联系',320,160);for(let i=0;i<4;i++)spr('fx_logos_s1_link',(Math.floor(t*12)+i)%4,128,32,320+i*128,180);ctx.fillText('法术弹',320,270);spr('proj_logos_ink',Math.floor(t*12)%4,64,24,320+(t*240)%440,300,2);requestAnimationFrame(draw)}
</script>
