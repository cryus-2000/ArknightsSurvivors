<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>C · 信物路线精修</title><style>body{margin:30px;background:#0c141e;color:#d8e3eb;font:16px system-ui}main{max-width:1280px;margin:auto}p{color:#9bafbd;line-height:1.8}button,a{background:#182c3c;color:#d9e9f4;border:1px solid #476070;padding:10px 16px;cursor:pointer}nav{display:flex;gap:10px;margin:20px 0}.scene{width:100%}.icons{display:flex;flex-wrap:wrap;gap:18px}figure{width:180px;margin:16px 0;padding:16px;background:#132130;text-align:center}figure img{width:64px;height:64px;image-rendering:pixelated}small{display:block;color:#8c9eae;margin-top:8px}h2{margin-top:40px}</style><main><h1>C · 信物路线精修</h1><p>复用现有信物，保留原色。图标采用原生 32px，缩小间距，卡底统一对齐，补上名称。选中后只显示结局名称，双路线分两行；不再显示标题和重复的信物名称。</p><nav><button onclick="show(0)">双路线</button><button onclick="show(1)">单路线</button><button onclick="show(2)">普通节点</button></nav><img class="scene" id="scene" src="shots/names_v2_0.png"><p id="caption">精修版 · 双路线</p><h2>可直接复用的九个信物图标</h2><p>来自现有 art/incoming/relic_*.png，均为 32×32。当前卡面用海潮的气息、主教的研究、深蓝回忆代表三条路线；不是本次选牌必得奖励，也不代表已经持有。</p><div class="icons"><figure><img src="icons/220.png"><figcaption>主教的研究<small>relic_220.png · 32×32</small></figcaption></figure><figure><img src="icons/221.png"><figcaption>深蓝之心<small>relic_221.png · 32×32</small></figcaption></figure><figure><img src="icons/222.png"><figcaption>海潮的气息<small>relic_222.png · 32×32</small></figcaption></figure><figure><img src="icons/223.png"><figcaption>退行的罗辛南特<small>relic_223.png · 32×32</small></figcaption></figure><figure><img src="icons/225.png"><figcaption>骑士骨血<small>relic_225.png · 32×32</small></figcaption></figure><figure><img src="icons/238.png"><figcaption>“决心”<small>relic_238.png · 32×32</small></figcaption></figure><figure><img src="icons/239.png"><figcaption>“观望”<small>relic_239.png · 32×32</small></figcaption></figure><figure><img src="icons/240.png"><figcaption>“犹疑”<small>relic_240.png · 32×32</small></figcaption></figure><figure><img src="icons/242.png"><figcaption>深蓝回忆<small>relic_242.png · 32×32</small></figcaption></figure></div><p>本页是实际游戏捕获的设计预览，未正式接入。首次探索隐藏路线提示的规则保留。手机布局尚未验证。</p><script>let selected=0;function show(n){selected=n;document.getElementById('scene').src='shots/names_v2_'+n+'.png';document.getElementById('caption').textContent='精修版 · '+['双路线','单路线','普通节点'][n]}</script></main></html>
