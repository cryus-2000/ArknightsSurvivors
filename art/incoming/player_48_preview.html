<!doctype html><html lang="zh"><meta charset="utf-8"><title>水月 48px 动画</title><style>body{background:#182b3b;color:#deedf5;font:16px system-ui;padding:24px}main{display:flex;flex-wrap:wrap;gap:20px}article{background:#243e51;padding:20px;border-radius:12px}canvas{image-rendering:pixelated;width:288px;height:288px;background:repeating-conic-gradient(#233547 0% 25%,#2a4053 0% 50%) 0/24px 24px}button{padding:10px;margin:10px}h2{font-size:18px}</style><h1>水月 · 48px 动画对照</h1><p>实际帧尺寸 48×48，6 倍放大。受击和倒下停在末帧。</p><button id="replay">重新播放</button><button id="pause">暂停 / 继续</button><main></main><script>
const specs=[['player_attack_48',4,16,true],['player_idle',4,4,true],['player_run',6,10,true],['player_hurt',2,10,false],['player_death',4,6,false]];
let elapsed=0,last=performance.now(),paused=false;
const entries=specs.map(([name,n,fps,loop])=>{let a=document.createElement('article');a.innerHTML=`<h2>${name}</h2><canvas width="48" height="48"></canvas><p>${n} 帧 · ${fps} fps</p><label>查看帧 <input type="range" min="0" max="${n-1}" value="0"></label>`;document.querySelector('main').append(a);let img=new Image();img.src=name+'.png';let slider=a.querySelector('input');let ctx=a.querySelector('canvas').getContext('2d');slider.oninput=()=>{paused=true;draw({img,ctx},+slider.value)};return {img,ctx,slider,n,fps,loop}});
function draw(e,f){if(!e.img.complete||!e.img.naturalWidth)return;e.ctx.clearRect(0,0,48,48);e.ctx.imageSmoothingEnabled=false;e.ctx.drawImage(e.img,f*48,0,48,48,0,0,48,48)}
function tick(now){if(!paused){elapsed+=(now-last)/1000;for(let e of entries){let f=Math.floor(elapsed*e.fps);f=e.loop?f%e.n:Math.min(f,e.n-1);draw(e,f);e.slider.value=f}}last=now;requestAnimationFrame(tick)}
document.querySelector('#replay').onclick=()=>{elapsed=0;paused=false};document.querySelector('#pause').onclick=()=>paused=!paused;requestAnimationFrame(tick);
</script></html>
