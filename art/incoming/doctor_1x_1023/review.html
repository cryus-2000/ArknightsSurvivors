<!doctype html><meta charset="utf-8"><title>博士 · 同队风格对照</title><style>body{background:#202832;color:#e2e6ec;font:16px sans-serif;margin:32px}section{display:flex;gap:16px;flex-wrap:wrap}figure{margin:0;text-align:center}canvas{width:256px;height:256px;image-rendering:pixelated;background:#35404a}figcaption{padding:12px}p{max-width:900px;line-height:1.7}a{color:#9ad4e6}</style><h1>博士 · 同队风格对照</h1><p><a href="actions/review.html">新版四动作已完成：查看待机、跑步、受击、倒下预览</a></p><p>三人统一用 64×64 画布、脚底 (32,60) 对齐，放大 4 倍。两名干员使用已交付 1 倍待机首帧；博士为新候选缩至可见高 40 像素的尺寸预览，尚未完成正式像素修整和动画。</p><section id="row"></section><p id="status">正在加载本地素材…</p><p><a href="idle_candidate_v2.png">新版原始候选</a> · <a href="idle_candidate.png">上一稿</a></p><script>
const items=[['logos_reference.png','逻各斯 · 已交付',false],['idle_candidate_v2.png','博士 · 新候选',true],['wisadel_reference.png','维什戴尔 · 已交付',false]];
let ready=0;for(const [src,label,fit] of items){const f=document.createElement('figure'),c=document.createElement('canvas'),cap=document.createElement('figcaption');c.width=c.height=64;cap.textContent=label;f.append(c,cap);row.append(f);const im=new Image();im.onload=()=>{const x=c.getContext('2d');x.imageSmoothingEnabled=false;if(!fit)x.drawImage(im,0,0,64,64,0,0,64,64);else{const t=document.createElement('canvas');t.width=im.width;t.height=im.height;const q=t.getContext('2d');q.drawImage(im,0,0);const p=q.getImageData(0,0,t.width,t.height).data;let l=t.width,r=0,u=t.height,b=0;for(let y=0;y<t.height;y++)for(let a=0;a<t.width;a++)if(p[(y*t.width+a)*4+3]>127){l=Math.min(l,a);r=Math.max(r,a);u=Math.min(u,y);b=Math.max(b,y);}const w=Math.round((r-l+1)*40/(b-u+1));x.drawImage(im,l,u,r-l+1,b-u+1,32-Math.floor(w/2),20,w,40);}if(++ready===3)document.getElementById('status').textContent='三张素材已加载。博士目前为风格与尺寸预览，未替换游戏文件。';};im.onerror=()=>document.getElementById('status').textContent='素材加载失败：'+src;im.src=src;}
</script>
