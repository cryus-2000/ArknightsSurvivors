<!doctype html><html lang="zh"><meta charset="utf-8"><title>博士 · 四动作预览</title>
<style>body{background:#202832;color:#e5e8ec;font:16px system-ui;margin:28px}p{line-height:1.7;max-width:960px}.toolbar{position:sticky;top:0;background:#202832;padding:12px 0;z-index:2}button,select{padding:8px 14px;margin-right:8px;background:#354353;color:inherit;border:1px solid #6a7d8f;border-radius:5px}.cards{display:flex;gap:18px;flex-wrap:wrap}.card{background:#2c3642;padding:18px;border-radius:8px}canvas{image-rendering:pixelated;background:#35414d;width:256px;height:256px}input{width:245px}.strip{display:block;image-rendering:pixelated;max-width:none;height:128px}.scroller{overflow:auto;margin:12px 0 30px}small{color:#b3c2cf}.lineup{display:flex;gap:12px}h2{font-size:19px}</style>
<h1>博士 · 待机 / 跑步 / 受击 / 倒下</h1><p>实际 64×64 帧条，按 4 倍整数放大显示。与批准候选保持同一造型，24 色以内、无额外外描边。倒下播完停末帧；受击素材已备齐，目前游戏没有博士受击的播放入口。尚未覆盖游戏素材。</p>
<div class="toolbar"><button id="play">暂停</button><button id="reset">从头播放</button><select id="speed"><option value="1">常速</option><option value="0.5">半速</option><option value="0.25">四分之一速</option></select><span id="status">加载素材…</span></div><div class="cards" id="cards"></div>
<h2>同队尺寸对照</h2><div class="lineup" id="lineup"></div><h2>逐帧展开（2 倍）</h2><div id="strips"></div>
<script>
const jobs=[['idle','待机',4,4,true],['run','跑步',8,10,true],['hurt','受击',2,10,false],['death','倒下',4,6,false]];let active=true,t=0,prev=performance.now(),loaded=0;const views=[];
function paint(c,im,f){const x=c.getContext('2d');x.clearRect(0,0,64,64);x.imageSmoothingEnabled=false;x.drawImage(im,f*64,0,64,64,0,0,64,64);x.fillStyle='#6e7c86';x.fillRect(0,61,64,1);}
for(const [id,label,n,fps,loop]of jobs){let d=document.createElement('div');d.className='card';d.innerHTML=`<h2>${label}</h2><canvas width="64" height="64"></canvas><p>${n} 帧 · ${fps} fps · ${(n/fps).toFixed(2)} 秒${loop?'循环':'，停末帧'}</p><input type="range" min="0" max="${n-1}" value="0" step="1"><br><small></small>`;cards.append(d);const im=new Image(),v={im,c:d.querySelector('canvas'),slider:d.querySelector('input'),text:d.querySelector('small'),n,fps,loop};views.push(v);im.onload=()=>{if(++loaded===4)document.getElementById('status').textContent='全部素材已加载';paint(v.c,im,0)};im.onerror=()=>document.getElementById('status').textContent='加载失败：'+id;im.src=`doctor_${id}.png`;v.slider.oninput=()=>{active=false;play.textContent='播放';paint(v.c,im,+v.slider.value);v.text.textContent=`第 ${+v.slider.value+1}/${n} 帧`};const box=document.createElement('div');box.innerHTML=`<p>${label}</p><div class="scroller"><img class="strip" src="doctor_${id}.png" style="width:${n*128}px"></div>`;strips.append(box);}
play.onclick=()=>{active=!active;play.textContent=active?'暂停':'播放'};reset.onclick=()=>{t=0;active=true;play.textContent='暂停'};
function tick(now){if(active)t+=(now-prev)/1000*Number(speed.value);prev=now;for(const v of views)if(v.im.complete&&v.im.naturalWidth&&active){let f=Math.floor(t*v.fps);f=v.loop?f%v.n:Math.min(f,v.n-1);paint(v.c,v.im,f);v.slider.value=f;v.text.textContent=`第 ${f+1}/${v.n} 帧`;}requestAnimationFrame(tick)}requestAnimationFrame(tick);
for(const [src,title]of [['../logos_reference.png','逻各斯'],['doctor_idle.png','博士'],['../wisadel_reference.png','维什戴尔']]){const d=document.createElement('div');d.innerHTML=`<p>${title}</p><canvas width="64" height="64"></canvas>`;lineup.append(d);const im=new Image();im.onload=()=>paint(d.querySelector('canvas'),im,0);im.src=src;}
</script></html>
